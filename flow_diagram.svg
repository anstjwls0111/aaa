<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'NanumGothic','NanumSquareRound','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <!-- 배경 -->
  <rect width="1000" height="640" fill="#f5f8fc"/>

  <!-- 화살표 마커 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7ec4"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="500" y="46" text-anchor="middle" font-size="30" font-weight="bold" fill="#1b3a5b">수륜면 버스 도착 알림 장치 · 작동 흐름</text>
  <text x="500" y="74" text-anchor="middle" font-size="15" fill="#5a6b7b">micro:bit 2개 · 무선(라디오) 통신</text>

  <!-- ===================== 버스용 (송신) ===================== -->
  <g>
    <rect x="40" y="120" width="300" height="220" rx="16" fill="#fff" stroke="#2f7ec4" stroke-width="3"/>
    <path d="M40,136 a16,16 0 0 1 16,-16 h268 a16,16 0 0 1 16,16 v28 h-300 z" fill="#2f7ec4"/>
    <!-- 작은 버스 아이콘 -->
    <g transform="translate(58,131)">
      <rect x="0" y="0" width="30" height="18" rx="3" fill="#fff"/>
      <rect x="4" y="3" width="6" height="6" fill="#2f7ec4"/>
      <rect x="13" y="3" width="6" height="6" fill="#2f7ec4"/>
      <rect x="22" y="3" width="5" height="6" fill="#2f7ec4"/>
      <circle cx="8" cy="19" r="3" fill="#fff"/>
      <circle cx="23" cy="19" r="3" fill="#fff"/>
    </g>
    <text x="200" y="149" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">버스용 micro:bit (송신)</text>

    <text x="70" y="200" font-size="18" fill="#1b3a5b">① 기사님이 정류장 근처 도착</text>
    <text x="70" y="240" font-size="18" fill="#1b3a5b">② <tspan font-weight="bold" fill="#c0392b">A버튼</tspan> 꾹 누름</text>
    <text x="70" y="280" font-size="18" fill="#1b3a5b">③ "버스 도착" 신호 발사</text>

    <!-- A버튼 아이콘 -->
    <circle cx="285" cy="305" r="22" fill="#fbe9e7" stroke="#c0392b" stroke-width="3"/>
    <text x="285" y="312" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">A</text>
  </g>

  <!-- ===================== 무선 화살표 ===================== -->
  <g>
    <line x1="345" y1="230" x2="455" y2="230" stroke="#2f7ec4" stroke-width="5" marker-end="url(#arrow)"/>
    <!-- 전파 표시 -->
    <g transform="translate(400,205)" stroke="#2f7ec4" stroke-width="2.5" fill="none">
      <path d="M -8,5 a 8,8 0 0 1 16,0"/>
      <path d="M -13,8 a 13,13 0 0 1 26,0"/>
    </g>
    <text x="400" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f7ec4">무선</text>
    <text x="400" y="252" text-anchor="middle" font-size="13" fill="#5a6b7b">같은 그룹(7)</text>
  </g>

  <!-- ===================== 정류장용 (수신) ===================== -->
  <g>
    <rect x="460" y="120" width="300" height="220" rx="16" fill="#fff" stroke="#27ae60" stroke-width="3"/>
    <path d="M460,136 a16,16 0 0 1 16,-16 h268 a16,16 0 0 1 16,16 v28 h-300 z" fill="#27ae60"/>
    <!-- 정류장 표지판 아이콘 -->
    <g transform="translate(478,128)">
      <rect x="10" y="0" width="2.5" height="22" fill="#fff"/>
      <rect x="0" y="0" width="22" height="10" rx="2" fill="#fff"/>
    </g>
    <text x="620" y="149" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">정류장용 micro:bit (수신)</text>

    <text x="490" y="200" font-size="18" fill="#1b3a5b">신호를 받으면…</text>
    <text x="490" y="240" font-size="17" fill="#1b3a5b">· 광센서로 낮/밤 확인</text>
    <text x="490" y="280" font-size="17" fill="#1b3a5b">· 어르신께 알림 시작</text>
    <text x="490" y="316" font-size="14" fill="#5a6b7b">평소엔 "버스 대기 중" 표시</text>
  </g>

  <!-- 아래로 내려가는 화살표 -->
  <line x1="610" y1="345" x2="610" y2="392" stroke="#27ae60" stroke-width="5" marker-end="url(#arrowG)"/>

  <!-- ===================== 출력 3가지 ===================== -->
  <!-- 화면(LED) -->
  <g>
    <rect x="120" y="410" width="220" height="155" rx="14" fill="#fff" stroke="#e67e22" stroke-width="3"/>
    <!-- 모니터 아이콘 -->
    <g transform="translate(205,428)">
      <rect x="0" y="0" width="50" height="34" rx="3" fill="#fdf2e6" stroke="#e67e22" stroke-width="2.5"/>
      <rect x="6" y="6" width="38" height="22" rx="1" fill="#e67e22" opacity="0.25"/>
      <rect x="20" y="34" width="10" height="6" fill="#e67e22"/>
    </g>
    <text x="230" y="496" text-anchor="middle" font-size="17" font-weight="bold" fill="#d35400">화면 (LED)</text>
    <text x="230" y="522" text-anchor="middle" font-size="15" fill="#5a6b7b">"버스 곧 도착!"</text>
    <text x="230" y="545" text-anchor="middle" font-size="13" fill="#8a98a6">눈으로 확인</text>
  </g>

  <!-- 부저 -->
  <g>
    <rect x="390" y="410" width="220" height="155" rx="14" fill="#fff" stroke="#8e44ad" stroke-width="3"/>
    <!-- 스피커 아이콘 -->
    <g transform="translate(480,430)">
      <path d="M0,9 h8 l10,-9 v34 l-10,-9 h-8 z" fill="#8e44ad"/>
      <path d="M22,8 a 12,12 0 0 1 0,18" stroke="#8e44ad" stroke-width="2.5" fill="none"/>
      <path d="M22,2 a 18,18 0 0 1 0,30" stroke="#8e44ad" stroke-width="2.5" fill="none"/>
    </g>
    <text x="500" y="496" text-anchor="middle" font-size="17" font-weight="bold" fill="#8e44ad">부저</text>
    <text x="500" y="522" text-anchor="middle" font-size="15" fill="#5a6b7b">"삑삑삑"</text>
    <text x="500" y="545" text-anchor="middle" font-size="13" fill="#8a98a6">귀로 확인</text>
  </g>

  <!-- RGB LED -->
  <g>
    <rect x="660" y="410" width="220" height="155" rx="14" fill="#fff" stroke="#c0392b" stroke-width="3"/>
    <!-- RGB 점 3개 -->
    <g transform="translate(745,445)">
      <circle cx="0" cy="0" r="10" fill="#e74c3c"/>
      <circle cx="25" cy="0" r="10" fill="#2ecc71"/>
      <circle cx="50" cy="0" r="10" fill="#3498db"/>
    </g>
    <text x="770" y="496" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">RGB LED</text>
    <text x="770" y="522" text-anchor="middle" font-size="15" fill="#5a6b7b">깜빡 + 밤엔 조명</text>
    <text x="770" y="545" text-anchor="middle" font-size="13" fill="#8a98a6">멀리서도 확인</text>
  </g>

  <!-- 분배 화살표 -->
  <line x1="610" y1="396" x2="232" y2="408" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowG)"/>
  <line x1="610" y1="396" x2="500" y2="408" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowG)"/>
  <line x1="610" y1="396" x2="768" y2="408" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowG)"/>

  <!-- 하단 안내 -->
  <text x="500" y="605" text-anchor="middle" font-size="14" fill="#5a6b7b">입력(광센서) → 처리(micro:bit) → 출력(화면 · 부저 · LED)   |   인터넷·앱 없이 정류장에서 바로 안내</text>
</svg>
